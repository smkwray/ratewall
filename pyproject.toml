[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ratewall"
version = "23.0.0"
description = "Accounting and source-registry kernel for debt-conditioned monetary transmission research."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.8",
  "ruff>=0.8",
]

[project.scripts]
ratewall = "ratewall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ratewall"]

[tool.hatch.build.targets.wheel.force-include]
"configs/ratewall_assumption_sets.yml" = "ratewall/configs/ratewall_assumption_sets.yml"
"configs/ratewall_parameter_packs.yml" = "ratewall/configs/ratewall_parameter_packs.yml"
"configs/ratewall_assumption_source_backing_overrides.yml" = "ratewall/configs/ratewall_assumption_source_backing_overrides.yml"
"configs/ratewall_dynamic_scenario_paths.yml" = "ratewall/configs/ratewall_dynamic_scenario_paths.yml"
"configs/sources.yml" = "ratewall/configs/sources.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider -m 'not full_surface'"
markers = [
  "full_surface: tests that require the legacy/full generated output surface",
  "audit_fast: fast RWTAM audit-polish subset suitable for serial -m audit_fast runs",
]

[tool.ruff]
line-length = 88
target-version = "py311"
