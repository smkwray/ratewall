    review_priority: compatibility_only
    model_use: Deprecated compatibility metadata only; must remain neutral at 1.00 and excluded from operative frontier, fragility, and prior-stack diagnostics.
    review_question: Is any generated surface still mistakenly treating this deprecated field as load-bearing?
