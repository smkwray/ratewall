    literature_context: Historical composite handle now replaced for interpretation by public_debt_stock_scale, treasury_repricing_speed_share, rate_path_bps_year, treasury_repricing_pass_through, fed_liability_stock_scale, IORB/ON RRP pass-through, and remittance timing shares.
