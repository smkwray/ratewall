version: 1

timestamp_policy:
  retrieval_timezone: UTC
  retrieval_timestamp_field: retrieved_at
  retrieval_timestamp_format: iso8601_utc_z
  source_release_timestamp_field: source_release_at
  source_release_timestamp_rule: >
    Use the source-provided release date, observation date, as-of date, or
    publication timestamp when available. If the source does not publish one,
    store null and preserve the retrieval timestamp.
  required_snapshot_fields:
    - source_id
    - series_id
    - source_url
    - units
    - frequency
    - transform
    - retrieved_at

sources:
  fred:
    name: FRED
    publisher: Federal Reserve Bank of St. Louis
    role: Macro, rates, reserve balances, and public-sector time-series mirrors.
    access: csv
    base_url: https://fred.stlouisfed.org/graph/fredgraph.csv
    documentation_url: https://fred.stlouisfed.org/docs/api/fred/
    update_cadence: series_specific
    timestamp_rule: Record retrieval UTC timestamp and FRED observation dates.

  treasury_fiscaldata:
    name: Treasury FiscalData
    publisher: U.S. Department of the Treasury
    role: Debt, auctions, monthly statements, and other Treasury operations data.
    access: json_api
    base_url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
    documentation_url: https://fiscaldata.treasury.gov/api-documentation/
    update_cadence: dataset_specific
    timestamp_rule: Record retrieval UTC timestamp and API reporting/as-of fields.

  treasury_direct:
    name: TreasuryDirect
    publisher: U.S. Department of the Treasury
    role: TreasuryDirect marketable-security guidance, buyback announcements, and results.
    access: public_page_json_api
    base_url: https://www.treasurydirect.gov
    documentation_url: https://www.treasurydirect.gov/auctions/announcements-data-results/buy-backs/
    update_cadence: operation_specific
    timestamp_rule: Record retrieval UTC timestamp and operation/settlement dates.

  treasury_hqm:
    name: Treasury HQM Corporate Bond Yield Curve
    publisher: U.S. Department of the Treasury
    role: High-quality-market corporate bond yield curve par and spot yield data.
    access: public_xls_workbook
    base_url: https://home.treasury.gov/system/files/226
    documentation_url: https://home.treasury.gov/data/treasury-coupon-issues-and-corporate-bond-yield-curve/corporate-bond-yield-curve
    update_cadence: monthly
    timestamp_rule: Record retrieval UTC timestamp, workbook hash, and latest monthly HQM observation date.

  treasury_tic:
    name: Treasury International Capital
    publisher: U.S. Department of the Treasury
    role: Foreign Treasury transaction and holder context.
    access: text_and_html_downloads
    base_url: https://ticdata.treasury.gov
    documentation_url: https://home.treasury.gov/data/treasury-international-capital-tic-system
    update_cadence: monthly
    timestamp_rule: Record retrieval UTC timestamp and TIC reporting month.

  ofr_stfm:
    name: OFR Short-Term Funding Monitor
    publisher: Office of Financial Research
    role: Money-market fund Treasury and Treasury-backed repo portfolio context.
    access: json_api
    base_url: https://data.financialresearch.gov
    documentation_url: https://data.financialresearch.gov/
    update_cadence: monthly
    timestamp_rule: Record retrieval UTC timestamp and latest monthly OFR observation date.

  ofr_research:
    name: OFR Research Publications
    publisher: Office of Financial Research
    role: OFR research and brief context for financial-intermediation source gates.
    access: public_html_and_pdf
    base_url: https://www.financialresearch.gov
    documentation_url: https://www.financialresearch.gov/briefs/
    update_cadence: publication_specific
    timestamp_rule: Record retrieval UTC timestamp, publication date, source page hash, and extracted context markers.

  sec_nmfp:
    name: SEC Form N-MFP Data Sets
    publisher: U.S. Securities and Exchange Commission
    role: Fund-level money-market fund portfolio and collateral detail for Treasury CUSIP context.
    access: monthly_zip_flat_files
    base_url: https://www.sec.gov
    documentation_url: https://www.sec.gov/data-research/sec-markets-data/dera-form-n-mfp-data-sets
    update_cadence: monthly
    timestamp_rule: Record retrieval UTC timestamp and latest report date in the monthly flat file.

  sec_statistics:
    name: SEC Statistics and Data Visualizations
    publisher: U.S. Securities and Exchange Commission
    role: Public aggregate Form PF private-fund statistics for fail-closed NDFI/private-credit source gates.
    access: public_json_statistics_download
    base_url: https://www.sec.gov/data-research/statistics-data-visualizations
    documentation_url: https://www.sec.gov/data-research/statistics-data-visualizations/private-fund-statistics
    update_cadence: quarterly
    timestamp_rule: Record retrieval UTC timestamp, SEC statistics release date, JSON hash, source-record hash, date bounds, and Form PF aggregate-only limitations.

  sec_edgar:
    name: SEC EDGAR company filings
    publisher: U.S. Securities and Exchange Commission
    role: Public BDC company-filing availability, portfolio-disclosure context, normalized filing-table investment-term panels, and ABS-EE asset-level CMBS panels for fail-closed NDFI/private-credit and CRE source gates.
    access: submissions_json_and_archived_company_filings
    base_url: https://data.sec.gov/submissions/
    documentation_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    update_cadence: filing_specific
    timestamp_rule: Record retrieval UTC timestamp, submissions JSON hash, filing HTML hash, source-record hash, filing/report dates, and public-filing/normalization limitations.

  atlanta_fed:
    name: Federal Reserve Bank of Atlanta
    publisher: Federal Reserve Bank of Atlanta
    role: CREMI commercial real estate market-performance context for fail-closed CRE denominator source gates.
    access: public_html_and_csv_download
    base_url: https://www.atlantafed.org
    documentation_url: https://www.atlantafed.org/research-and-data/data/commercial-real-estate-market-index
    update_cadence: quarterly
    timestamp_rule: Record retrieval UTC timestamp, source CSV/page hashes, row counts, schema review metadata, and raw-data sharing limitations.

  cbo:
    name: Congressional Budget Office
    publisher: Congressional Budget Office
    role: Budget and economic projections for baseline scenarios.
    access: report_and_downloads
    base_url: https://www.cbo.gov
    documentation_url: https://www.cbo.gov/about/products/budget-economic-data
    update_cadence: report_specific
    timestamp_rule: Record retrieval UTC timestamp plus report publication date.

  fed_h41:
    name: Federal Reserve H.4.1
    publisher: Board of Governors of the Federal Reserve System
    role: Reserve balances, Federal Reserve balance sheet, remittances, and deferred asset context.
    access: release_page
    base_url: https://www.federalreserve.gov/releases/h41/
    documentation_url: https://www.federalreserve.gov/releases/h41/
    update_cadence: weekly
    timestamp_rule: Record retrieval UTC timestamp and release date when parsed.

  ny_fed:
    name: Federal Reserve Bank of New York
    publisher: Federal Reserve Bank of New York
    role: Desk operations, SOMA holdings, secured reference rates, and ON RRP context.
    access: json_api
    base_url: https://markets.newyorkfed.org/api
    documentation_url: https://markets.newyorkfed.org/
    update_cadence: dataset_specific
    timestamp_rule: Record retrieval UTC timestamp and API operation/as-of dates.

  philadelphia_fed:
    name: Federal Reserve Bank of Philadelphia
    publisher: Federal Reserve Bank of Philadelphia
    role: FR Y-14 consumer-credit and large-bank credit-card context for fail-closed denominator source gates.
    access: csv_and_guidance_pages
    base_url: https://www.philadelphiafed.org
    documentation_url: https://www.philadelphiafed.org/surveys-and-data/large-bank-credit-card-and-mortgage-data
    update_cadence: quarterly
    timestamp_rule: Record retrieval UTC timestamp, release quarter, source-file hashes, and methodology/definition page hashes.

  jec_treasury:
    name: JEC Treasury Debt Update
    publisher: U.S. Congress Joint Economic Committee / U.S. Treasury
    role: Treasury maturity and near-term repricing anchors when CUSIP-level data are not yet available.
    access: public_report
    base_url: https://www.jec.senate.gov/public/vendor/_accounts/JEC-R/debt/Monthly%20Debt%20Update.html
    documentation_url: https://www.jec.senate.gov/public/vendor/_accounts/JEC-R/debt/Monthly%20Debt%20Update.html
    update_cadence: monthly
    timestamp_rule: Record retrieval UTC timestamp and report as-of date when parsed.

  fed_dfa:
    name: Distributional Financial Accounts
    publisher: Board of Governors of the Federal Reserve System
    role: Distributional household balance-sheet exposure used to separate rate-income channels from representative-agent aggregates.
    access: public_data_download
    base_url: https://www.federalreserve.gov/releases/efa/efa-distributional-financial-accounts.htm
    documentation_url: https://www.federalreserve.gov/releases/efa/efa-distributional-financial-accounts.htm
    update_cadence: quarterly
    timestamp_rule: Record retrieval UTC timestamp and release/as-of quarter when parsed.

  fed_scf:
    name: Survey of Consumer Finances
    publisher: Board of Governors of the Federal Reserve System
    role: Public household/family balance-sheet, debt, income, and payment-context microdata for fail-closed recipient and denominator gates.
    access: public_zip_csv
    base_url: https://www.federalreserve.gov/econres/scfindex.htm
    documentation_url: https://www.federalreserve.gov/econres/scf-documentation.htm
    update_cadence: triennial
    timestamp_rule: Record retrieval UTC timestamp and official survey/data release date when parsed.

  fed_shed:
    name: Survey of Household Economics and Decisionmaking
    publisher: Board of Governors of the Federal Reserve System
    role: Public household financial-fragility, emergency-expense, and credit-payment behavior context for fail-closed consumer-credit denominator gates.
    access: public_zip_csv
    base_url: https://www.federalreserve.gov/consumerscommunities/shed_data.htm
    documentation_url: https://www.federalreserve.gov/consumerscommunities/shed_data.htm
    update_cadence: annual
    timestamp_rule: Record retrieval UTC timestamp, source ZIP/codebook hashes, survey year, schema review metadata, and current-demand blocker.

  sf_fed:
    name: SF Fed Monetary Policy Surprises
    publisher: Federal Reserve Bank of San Francisco
    role: High-frequency monetary policy surprise measures for empirical identification.
    access: csv_and_excel_download
    base_url: https://www.frbsf.org/research-and-insights/data-and-indicators/monetary-policy-surprises/
    documentation_url: https://www.frbsf.org/research-and-insights/data-and-indicators/monetary-policy-surprises/
    update_cadence: periodic
    timestamp_rule: Record retrieval UTC timestamp and latest FOMC-event date in the file.

  fed_feds:
    name: Federal Reserve FEDS Monetary Policy Shock Data
    publisher: Board of Governors of the Federal Reserve System
    role: Official Federal Reserve research-data monetary policy shock series used as an admissible external-proxy candidate.
    access: csv_download
    base_url: https://www.federalreserve.gov/econres/feds/a-unified-measure-of-fed-monetary-policy-shocks.htm
    documentation_url: https://www.federalreserve.gov/econres/feds/a-unified-measure-of-fed-monetary-policy-shocks.htm
    update_cadence: static_research_data
    timestamp_rule: Record retrieval UTC timestamp and official source update date when parsed.

  fed_feds_notes:
    name: Federal Reserve FEDS Notes
    publisher: Board of Governors of the Federal Reserve System
    role: Federal Reserve research-note context for private-credit and nonbank monetary-transmission mechanisms.
    access: public_html_note
    base_url: https://www.federalreserve.gov/econres/notes/feds-notes/
    documentation_url: https://www.federalreserve.gov/econres/notes/feds-notes/
    update_cadence: note_specific
    timestamp_rule: Record note URL, publication date, retrieval timestamp, source page hash, and extracted context markers.

  boston_fed:
    name: Federal Reserve Bank of Boston
    publisher: Federal Reserve Bank of Boston
    role: Federal Reserve Bank research context for consumer-credit rate transmission and fail-closed denominator gates.
    access: public_html_article
    base_url: https://www.bostonfed.org
    documentation_url: https://www.bostonfed.org/publications/current-policy-perspectives.aspx
    update_cadence: publication_specific
    timestamp_rule: Record article URL, publication date, retrieval timestamp, source page hash, and extracted context markers.

  fed_sloos:
    name: Federal Reserve Senior Loan Officer Opinion Survey
    publisher: Board of Governors of the Federal Reserve System
    role: Bank lending-standard, demand, and credit-term context for denominator-drag candidates.
    access: release_page_and_ddp
    base_url: https://www.federalreserve.gov/data/sloos/
    documentation_url: https://www.federalreserve.gov/data/sloos/about.htm
    update_cadence: quarterly
    timestamp_rule: Record release page URL, retrieval timestamp, source page hash, and survey period.

  mba_newslink:
    name: MBA Newslink
    publisher: Mortgage Bankers Association
    role: Public commercial/multifamily mortgage maturity and debt-outstanding context for CRE refinancing denominator candidates.
    access: public_html_release
    base_url: https://newslink.mba.org
    documentation_url: https://newslink.mba.org
    update_cadence: report_specific
    timestamp_rule: Record release page URL, publication date, retrieval timestamp, source page hash, and extracted maturity-year context.

  berkeley_romer_romer:
    name: Berkeley Romer-Romer Monetary Shock Data Appendix
    publisher: Christina D. Romer and David H. Romer
    role: Static narrative monetary-shock appendix for denominator replication context.
    access: reviewed_converted_csv_snapshot_from_legacy_xls
    base_url: https://eml.berkeley.edu/~cromer/Data/Shocks/
    documentation_url: https://eml.berkeley.edu/~cromer/Data/Shocks/RomerandRomerDataDescriptions.pdf
    update_cadence: static_research_data
    timestamp_rule: Record source workbook hash, data-description hash, converted CSV hash, conversion timestamp, and sample-alignment metadata.

  irs_soi:
    name: IRS Statistics of Income Individual Statistical Tables
    publisher: Internal Revenue Service
    role: Taxable-interest and tax-return context for fail-closed interest-income tax clawback leakage review.
    access: reviewed_converted_csv_snapshot_from_public_xls
    base_url: https://www.irs.gov/statistics/soi-tax-stats-individual-statistical-tables-by-size-of-adjusted-gross-income
    documentation_url: https://www.irs.gov/statistics/soi-tax-stats-individual-statistical-tables-by-size-of-adjusted-gross-income
    update_cadence: annual
    timestamp_rule: Record source workbook hash, converted CSV hash, tax year, filing year, publication month, and schema review metadata.

  irs_tax_guidance:
    name: IRS Tax Payment Guidance
    publisher: Internal Revenue Service
    role: Tax-payment timing context for fail-closed interest-income tax clawback leakage review.
    access: html_guidance_page
    base_url: https://www.irs.gov/payments
    documentation_url: https://www.irs.gov/payments
    update_cadence: guidance_page_specific
    timestamp_rule: Record guidance page URL, page-posted date when available, retrieval timestamp, source page hash, reviewed timing markers, and schema review metadata.

  federation_of_tax_administrators:
    name: Federation of Tax Administrators
    publisher: Federation of Tax Administrators
    role: State individual income-tax-rate table context for fail-closed interest-income tax clawback leakage review.
    access: public_html_table
    base_url: https://taxadmin.org
    documentation_url: https://taxadmin.org/tax-rates-new/
    update_cadence: annual
    timestamp_rule: Record source page URL, as-of date, retrieval timestamp, source page hash, parsed table row count, and schema review metadata.

  ea_tdc:
    name: EA-TDC sibling project
    publisher: Local sibling project
    role: Canonical matched-deposit TDC pass-through estimate used only for Dynamic Assumption Mode liquidity/deposit-state scenarios.
    access: local_artifact
    base_url: https://local.invalid/ea-tdc
    documentation_url: https://local.invalid/ea-tdc
    update_cadence: sibling_project_snapshot
    timestamp_rule: Record sibling artifact path, sample window, method label, and local snapshot timestamp.

  cfpb:
    name: Consumer Financial Protection Bureau
    publisher: Consumer Financial Protection Bureau
    role: BNPL market scale and consumer-credit context; not incidence, welfare, tax, or pricing evidence.
    access: report_download
    base_url: https://www.consumerfinance.gov
    documentation_url: https://www.consumerfinance.gov/data-research/research-reports/
    update_cadence: report_specific
    timestamp_rule: Record retrieval UTC timestamp and report publication date.

  bea:
    name: Bureau of Economic Analysis
    publisher: U.S. Bureau of Economic Analysis
    role: NIPA net-interest accounting definitions and national-account context.
    access: methodology_report
    base_url: https://www.bea.gov
    documentation_url: https://www.bea.gov/resources/methodologies/nipa-handbook
    update_cadence: methodology_specific
    timestamp_rule: Record report chapter/version date when used.

  census_qfr:
    name: Census Quarterly Financial Report
    publisher: U.S. Census Bureau
    role: Candidate firm interest expense and working-capital context.
    access: report_or_table_download
    base_url: https://www.census.gov/programs-surveys/qfr.html
    documentation_url: https://www.census.gov/programs-surveys/qfr.html
    update_cadence: quarterly
    timestamp_rule: Record release quarter and retrieval timestamp when ingested.

  ffiec_cdr:
    name: FFIEC Central Data Repository
    publisher: Federal Financial Institutions Examination Council
    role: Public Call Report bulk-data context for deposit-rate pass-through, loan maturity/repricing exposure, and bank balance-sheet conditioning.
    access: public_bulk_download
    base_url: https://cdr.ffiec.gov/public/PWS/DownloadBulkData.aspx
    documentation_url: https://cdr.ffiec.gov/public/PWS/DownloadBulkData.aspx
    update_cadence: quarterly
    timestamp_rule: Record retrieval UTC timestamp, report quarter, file hash, row count, and schedule/field coverage limitations before any materialized use.

  fdic:
    name: Federal Deposit Insurance Corporation
    publisher: Federal Deposit Insurance Corporation
    role: Public deposit-rate benchmark, Summary of Deposits, and BankFind financials context for bank distribution-route conditioning.
    access: public_downloads_and_json_api
    base_url: https://www.fdic.gov
    documentation_url: https://api.fdic.gov/banks/docs/
    update_cadence: dataset_specific
    timestamp_rule: Record retrieval UTC timestamp, publication/as-of date, file hash, and product or market coverage limitations.

  ici:
    name: Investment Company Institute
    publisher: Investment Company Institute
    role: Public industry money-market-fund asset context for retail/institutional MMF substitution diagnostics.
    access: public_report_download
    base_url: https://www.ici.org
    documentation_url: https://www.ici.org/research/stats/mmf
    update_cadence: weekly
    timestamp_rule: Record retrieval UTC timestamp, report week, source file hash, and retail/institutional/fund-type scope limitations.

  compustat:
    name: Compustat candidate firm panel
    publisher: S&P Global
    role: Candidate firm cash, debt maturity, and working-capital panel; not currently bundled.
    access: licensed_candidate_not_bundled
    base_url: https://www.spglobal.com/marketintelligence/en/solutions/products/compustat
    documentation_url: https://www.spglobal.com/marketintelligence/en/solutions/products/compustat
    update_cadence: licensed_dataset_specific
    timestamp_rule: Do not treat as available unless a local licensed artifact is registered.

  research_literature:
    name: Research literature source notes
    publisher: Mixed academic and policy sources
    role: Literature-context source IDs for diagnostics that do not create source-backed priors.
    access: citation_context
    base_url: https://local.invalid/research-literature
    documentation_url: https://local.invalid/research-literature
    update_cadence: static_or_review_specific
    timestamp_rule: Record citation, URL, and review date when moved beyond context.

  mosler_economics:
    name: Mosler Economics
    publisher: Mosler Economics
    role: Term-structure price-level theory context; not CPI or forward-price output evidence.
    access: public_pdf
    base_url: https://moslereconomics.com
    documentation_url: https://moslereconomics.com
    update_cadence: paper_specific
    timestamp_rule: Record draft date and retrieval timestamp when used.

  cme_group:
    name: CME Group education/source notes
    publisher: CME Group
    role: Cost-of-carry formula context; not price forecast evidence.
    access: public_education_note
    base_url: https://www.cmegroup.com
    documentation_url: https://www.cmegroup.com
    update_cadence: note_specific
    timestamp_rule: Record page date/retrieval timestamp when used.

series:
  WRESBAL:
    source: fred
    name: Reserve Balances with Federal Reserve Banks
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=WRESBAL
    units: millions_of_dollars
    frequency: weekly
    transform: level
    update_cadence: weekly
    release: H.4.1
    liability_channel: reserves

  RRPONTSYD:
    source: fred
    name: Overnight Reverse Repurchase Agreements
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=RRPONTSYD
    units: millions_of_dollars
    frequency: daily
    transform: level
    update_cadence: daily
    release: Temporary Open Market Operations
    liability_channel: on_rrp

  GDP:
    source: fred
    name: Gross Domestic Product
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=GDP
    units: billions_of_dollars
    frequency: quarterly
    transform: level
    update_cadence: quarterly
    release: National Income and Product Accounts
    liability_channel: scale

  PCEC:
    source: fred
    name: Personal Consumption Expenditures
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCEC
    units: billions_of_dollars_saar
    frequency: monthly
    transform: level
    update_cadence: monthly
    release: Personal Income and Outlays
    liability_channel: tdsp_current_demand_refresh_contract

  PCECC96:
    source: fred
    name: Real Personal Consumption Expenditures
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCECC96
    units: billions_of_chained_2017_dollars_saar
    frequency: monthly
    transform: level
    update_cadence: monthly
    release: Personal Income and Outlays
    liability_channel: tdsp_current_demand_refresh_contract

  DSPI:
    source: fred
    name: Disposable Personal Income
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=DSPI
    units: billions_of_dollars_saar
    frequency: monthly
    transform: level
    update_cadence: monthly
    release: Personal Income and Outlays
    liability_channel: tdsp_current_demand_refresh_contract

  PCEPILFE:
    source: fred
    name: "Personal Consumption Expenditures Excluding Food and Energy, Chain-Type Price Index"
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCEPILFE
    units: index_2017_100
    frequency: monthly
    transform: level
    update_cadence: monthly
    release: Personal Income and Outlays
    liability_channel: empirical_outcome

  PII:
    source: fred
    name: Personal Interest Income
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=PII
    units: billions_of_dollars_saar
    frequency: monthly
    transform: personal_interest_income_context
    update_cadence: monthly
    release: Personal Income and Outlays
    liability_channel: recipient_tax_clawback_context

  W055RC1:
    source: fred
    name: Personal Current Taxes
    endpoint: https://fred.stlouisfed.org/graph/fredgraph.csv?id=W055RC1
    units: billions_of_dollars_saar
    frequency: monthly
    transform: personal_current_tax_context
    update_cadence: monthly
    release: Personal Income and Outlays
    liability_channel: recipient_tax_clawback_context

  irs_soi_taxable_interest:
    source: irs_soi
    name: IRS SOI Table 1.4 taxable interest by adjusted gross income
    endpoint: https://www.irs.gov/pub/irs-soi/23in14ar.xls
    units: return_counts_and_thousands_of_dollars
    frequency: annual
    transform: taxable_interest_tax_context_by_agi
    update_cadence: annual
    release: Individual Statistical Tables by Size of Adjusted Gross Income, Tax Year 2023
    liability_channel: recipient_tax_clawback_context

  irs_soi_ira_type_agi:
    source: irs_soi
    name: IRS SOI Table 3 IRA plans by type and adjusted gross income
    endpoint: https://www.irs.gov/pub/irs-soi/22in03ira.xlsx
    units: return_counts_and_thousands_of_dollars
    frequency: annual
    transform: ira_type_agi_account_type_context
    update_cadence: annual
    release: IRS SOI Individual Retirement Arrangements Study, Tax Year 2022
    liability_channel: recipient_tax_clawback_account_type_context

  irs_soi_average_tax_rate_percentile:
    source: irs_soi
    name: IRS SOI Table 4.1 average tax rates by income percentile
    endpoint: https://www.irs.gov/pub/irs-soi/23in41ts.xlsx
    units: return_counts_millions_of_dollars_and_percentages
    frequency: annual
    transform: average_tax_rate_percentile_context
    update_cadence: annual
    release: IRS SOI Table 4.1 all individual returns excluding dependents, Tax Years 2001-2023
    liability_channel: recipient_tax_clawback_tax_rate_distribution_context

  irs_estimated_tax_payment_timing:
    source: irs_tax_guidance
    name: IRS estimated tax payment timing guidance for interest income
    endpoint: https://www.irs.gov/payments/pay-as-you-go-so-you-wont-owe-a-guide-to-withholding-estimated-taxes-and-ways-to-avoid-the-estimated-tax-penalty
    units: recurring_due_date_context
    frequency: annual_recurring_quarterly_schedule
    transform: estimated_tax_payment_timing_context
    update_cadence: guidance_page_specific
    release: Pay as you go estimated tax guidance
    liability_channel: recipient_tax_clawback_payment_timing_context

  irs_soi_state_interest_agi:
    source: irs_soi
    name: IRS SOI Historic Table 2 taxable interest by state and adjusted gross income
    endpoint: https://www.irs.gov/pub/irs-soi/22in55cmcsv.csv
    units: return_counts_and_thousands_of_dollars
    frequency: annual
    transform: state_agi_interest_tax_context
    update_cadence: annual
    release: Historic Table 2 state data, Tax Year 2022
    liability_channel: recipient_tax_clawback_state_agi_context

  treasury_security_interest_tax_treatment:
    source: treasury_direct
