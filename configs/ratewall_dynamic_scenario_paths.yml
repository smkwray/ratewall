schema: ratewall.dynamic_scenario_paths.v1
generated_for_release: 24_dynamic_assumption_mode
description: Source-gated dynamic Assumption Mode paths for RateWall scenario diagnostics.
claim_boundary: dynamic_assumption_mode_scenario_implied_not_empirical_threshold_date
period_frequency: quarterly
start_period: 2026Q2
periods: 16
tdc_effect_role: liquidity_deposit_state_scenario_input_not_incidence_or_mpc
defaults:
  source_status: dynamic_assumption_mode_source_gated
  evidence_needed: source-backed debt/GDP, policy-rate, liquidity, repricing, timing, and denominator-response path evidence before prior narrowing.
  promotion_gate: dynamic path remains scenario-only until source-backed path inputs and validation gates pass.
  policy_rate_bps_role: denominator_impulse_scale_and_public_cashflow_amplitude_relative_to_100bp_not_a_second_rate_path
  rate_path_bps_year_role: public_liability_duration_exposure_scale_relative_to_100_bps_year_not_raw_rate_shock
  joint_policy_rate_rate_path_guard: policy_rate_bps_and_rate_path_bps_year_may_only_both_move_when_scenario_describes_amplitude_times_duration_exposure_otherwise_hold_one_at_100
